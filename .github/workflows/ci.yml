name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Detections, posture check, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools
        run: pip install pytest ruff
      - name: Lint
        run: ruff check functions tests --select E,F,W --line-length 120
      - name: Tests
        run: pytest -q tests
      - name: Simulator (all attack scenarios, offline)
        run: python functions/simulator.py all
      - name: Conditional Access posture check (sample tenant)
        run: python functions/ca_posture.py --demo

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format, init, validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
