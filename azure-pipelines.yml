trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Validate
    displayName: 'Terraform Validation'
    jobs:
      - job: TerraformValidate
        displayName: 'Validate Infrastructure'
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'
            displayName: 'Install Terraform'

          - script: |
              cd terraform
              terraform fmt -check -recursive
              terraform init -backend=false
              terraform validate
            displayName: 'Terraform Format, Init & Validate'

  - stage: Python
    displayName: 'Detections and Tests'
    dependsOn: []
    jobs:
      - job: Test
        displayName: 'Lint, test, run offline'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
            displayName: 'Use Python 3.12'

          - script: |
              pip install pytest ruff
              ruff check functions tests --select E,F,W --line-length 120
              pytest -q tests
              python functions/simulator.py all
              python functions/ca_posture.py --demo
            displayName: 'Lint, pytest, simulator, posture check'

  - stage: Docs
    displayName: 'Runbook and Query Audit'
    dependsOn: []
    jobs:
      - job: DocCheck
        displayName: 'Verify runbooks and KQL'
        steps:
          - script: |
              for f in runbooks/*.md; do echo "[OK] $(basename $f) - $(wc -l < $f) lines"; done
              for f in queries/*.kql; do echo "[OK] $(basename $f) - $(wc -l < $f) lines"; done
            displayName: 'Audit runbooks and queries'
